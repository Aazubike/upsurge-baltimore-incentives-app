<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick feedback — UpSurge Baltimore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .survey-wrap { max-width: 620px; margin: 0 auto; padding: 3rem 2rem 4rem; }
    .survey-wrap .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 1rem;
    }
    .survey-wrap h1 {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      margin-bottom: 0.75rem;
    }
    .survey-wrap p.sub { color: var(--gray); margin-bottom: 2.5rem; }

    .field-card { margin-bottom: 1.5rem; }

    .radio-group { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 0.75rem; }
    .radio-option {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      font-size: 0.92rem;
      color: var(--off-white);
      cursor: pointer;
    }
    .radio-option input[type="radio"] {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      min-width: 18px;
      border: 1.5px solid var(--gray-dim);
      border-radius: 50%;
      background: var(--bg);
      cursor: pointer;
      position: relative;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .radio-option input[type="radio"]:hover { border-color: var(--off-white); }
    .radio-option input[type="radio"]:checked { border-color: var(--red); }
    .radio-option input[type="radio"]:checked::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--red);
    }

    textarea {
      background: var(--surface);
      border: 1px solid var(--hairline);
      color: var(--white);
      font-family: var(--font-body);
      font-size: 0.95rem;
      padding: 0.75rem 0.9rem;
      border-radius: 6px;
      outline: none;
      width: 100%;
      min-height: 90px;
      resize: vertical;
      transition: border-color 0.15s ease;
      margin-top: 0.75rem;
    }
    textarea:hover { border-color: var(--gray-dim); }
    textarea:focus { border-color: var(--red); }
    textarea::placeholder { color: var(--gray-dim); }
  </style>
</head>
<body>

  <header class="site-header">
    <a href="/"><img class="logo" src="/static/img/upsurge_logo.png" alt="UpSurge Baltimore"></a>
  </header>

  <div class="survey-wrap">
    <div class="eyebrow">Feedback</div>
    <h1>How were your results?</h1>
    <p class="sub">Takes under a minute and helps us make the matches better.</p>

    <form method="post" action="/feedback/survey/{{ submission_id }}" class="flow-form">
      <input type="hidden" name="job_id" value="{{ job_id }}">

      <div class="field-card">
        <div class="field-label">Did you like what you saw?</div>
        <div class="radio-group">
          <label class="radio-option"><input type="radio" name="found_what_needed" value="liked"> Yes, these looked like solid fits</label>
          <label class="radio-option"><input type="radio" name="found_what_needed" value="mixed"> Some were useful, others weren't</label>
          <label class="radio-option"><input type="radio" name="found_what_needed" value="not_useful"> Not really what I was looking for</label>
        </div>
      </div>

      <div class="field-card">
        <div class="field-label">What could we improve, or what didn't work well?</div>
        <textarea name="improve_notes" placeholder="Optional"></textarea>
      </div>

      <div class="field-card">
        <div class="field-label">Anything the intake form should ask about, or another category of incentive we should cover?</div>
        <textarea name="missing_data_notes" placeholder="Optional"></textarea>
      </div>

      <button type="submit" class="submit-btn">Send feedback</button>
    </form>
  </div>

</body>
</html>
